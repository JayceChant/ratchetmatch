# SonarCloud 项目配置（对应 GitHub 仓库 JayceChant/ratchetmatch）
# 需先在 SonarCloud 以 GitHub 账号登录并导入本仓库，再配置仓库 Secret SONAR_TOKEN
# 与 SonarCloud App（PR 装饰），详见 README「质量与持续集成」一节。
sonar.projectKey=JayceChant_ratchetmatch
sonar.organization=jaycechant

# 与 go.mod 的 go 指令保持一致
sonar.go.version=1.27

sonar.sources=.
sonar.inclusions=**/*.go
# example/ 为独立 module 的演示程序（package main，无测试价值），不参与覆盖率分母；
# 覆盖率文件 coverage.txt 本就只含根模块，不排除会被 SonarCloud 计为 0% 覆盖
sonar.exclusions=**/*_test.go,**/testdata/**,**/example/**

# Go 覆盖率专用属性：只解析 go test -coverprofile 的文本格式；
# 通用属性 sonar.coverage.reportPaths 只认 Generic/Cobertura XML，误用会静默丢弃数据（面板 0%）
sonar.go.coverage.reportPaths=coverage.txt

# 中文注释是本库注释规范，关闭对源码编码的猜疑
sonar.sourceEncoding=UTF-8
