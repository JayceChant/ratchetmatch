# govulncheck 官方漏洞库扫描（独立 workflow）
# 独立原因：GitHub Actions 状态徽章是 workflow 级而非 job 级，
# 供 README 单独展示漏洞扫描徽章（须与 ci.yml 同触发条件）。
name: govulncheck

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      # action 引用统一锚定 tag 对应的 commit hash（防 tag 被移动导致行为漂移），升级须手动
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: govulncheck（官方漏洞数据库扫描）
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
